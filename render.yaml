services:
  - type: web
    name: xiangqi-online-backend
    runtime: node
    plan: starter
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xiangqi-online-db
          property: connectionString
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: SHORT_CODE_LENGTH
        value: "6"
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.example.com

databases:
  - name: xiangqi-online-db
    plan: basic-256mb
